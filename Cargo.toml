[package]
name = "yoink"
version = "0.1.0"
edition = "2021"
description = "A terminal clipboard manager with history, search, and a TUI"
license = "MIT"

[dependencies]
anyhow = "1.0"
arboard = "3.4"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "5.0"
fs2 = "0.4"
ratatui = { version = "0.29", features = ["crossterm"] }
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
daemonize = "0.5"

[profile.release]
lto = true
strip = true
